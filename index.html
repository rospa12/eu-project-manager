<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EU Project Manager — HOLA & FESR</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--eu:#003399;--eu-d:#001f6e;--gold:#FFCC00;--gold-d:#cc9900;--border:#C5CEDF;--bg:#f5f7fc;--card:#fff;--text:#1a2340;--muted:#5a6a8a;--font:'IBM Plex Sans',sans-serif;--mono:'IBM Plex Mono',monospace;--r:4px;}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:13px;min-height:100vh;display:flex;flex-direction:column}
.topbar{background:var(--eu);color:#fff;padding:0 16px;display:flex;align-items:center;gap:12px;height:48px;border-bottom:3px solid var(--gold);flex-shrink:0}
.eu-stars{display:flex;gap:2px;flex-wrap:wrap;width:22px}
.eu-stars span{color:var(--gold);font-size:7px;line-height:8px}
.topbar-title{font-size:14px;font-weight:600;letter-spacing:.02em}
.sync-badge{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:11px;opacity:.8}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#4caf50}
.sync-dot.syncing{background:var(--gold);animation:pulse 1s infinite}
.sync-dot.error{background:#f44336}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.project-switcher{display:flex;align-items:center;gap:6px;margin-left:12px}
.project-switcher select{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:var(--r);padding:4px 8px;font-family:var(--font);font-size:12px;cursor:pointer}
.project-switcher select option{background:#003399;color:#fff}
.btn-new-proj{background:var(--gold);color:var(--eu);border:none;border-radius:var(--r);padding:4px 10px;font-size:11px;font-weight:600;cursor:pointer}
.layout{display:flex;flex:1;min-height:0}
.sidebar{width:190px;background:var(--eu);flex-shrink:0;overflow-y:auto;padding:10px 0}
.nav-label{font-size:9px;font-weight:600;letter-spacing:.12em;color:rgba(255,255,255,.35);padding:12px 12px 4px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:7px;padding:7px 12px;cursor:pointer;font-size:12px;color:rgba(255,255,255,.65);transition:all .12s;margin:1px 6px;border-radius:var(--r)}
.nav-item:hover{background:rgba(255,255,255,.1);color:#fff}
.nav-item.active{background:rgba(255,204,0,.15);color:var(--gold);border-left:2px solid var(--gold);padding-left:10px}
.main{flex:1;overflow-y:auto;padding:16px}
.page{display:none}.page.active{display:block}
.page-title{font-size:15px;font-weight:600;color:var(--eu);margin-bottom:14px;display:flex;align-items:center;gap:10px}
.page-title::after{content:'';flex:1;height:1px;background:var(--border)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);margin-bottom:14px}
.card-header{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;background:#fafbfd}
.card-title{font-weight:600;font-size:12px;color:var(--eu);flex:1}
.card-body{padding:14px}
.stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:10px 12px}
.stat-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.stat-value{font-size:20px;font-weight:600;color:var(--eu);font-family:var(--mono)}
.stat-sub{font-size:10px;color:var(--muted);margin-top:1px}
.data-table{width:100%;border-collapse:collapse}
.data-table th{text-align:left;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:7px 9px;border-bottom:2px solid var(--border);background:#fafbfd;white-space:nowrap}
.data-table td{padding:8px 9px;border-bottom:1px solid #eef1f7;vertical-align:middle}
.data-table tr:last-child td{border-bottom:none}
.data-table tr:hover td{background:#f8f9fd}
.badge{display:inline-block;padding:2px 6px;border-radius:2px;font-size:10px;font-weight:600;letter-spacing:.04em;font-family:var(--mono)}
.badge-wp{background:#dce8ff;color:#1a3a8a}
.badge-ms{background:#fff0cc;color:#7a5000;border:1px solid #ffcc00}
.badge-del{background:#dff2e8;color:#1a5c35}
.badge-ok{background:#dff2e8;color:#1a5c35}
.badge-risk{background:#fff3dc;color:#7a4a00}
.badge-late{background:#fde;color:#7a1a2a}
.badge-new{background:#e8eeff;color:#1a3a8a}
.badge-partner{background:#f0e8ff;color:#4a1a8a}.badge-pu{background:#dff2e8;color:#1a5c35}.badge-co{background:#fff0cc;color:#7a5000;border:1px solid #ffcc00}.badge-ci{background:#fde;color:#7a1a2a}
.btn{padding:5px 12px;border-radius:var(--r);border:1px solid var(--border);font-family:var(--font);font-size:12px;font-weight:500;cursor:pointer;transition:all .12s;display:inline-flex;align-items:center;gap:5px;background:#fff}
.btn:hover{background:#f0f4ff;border-color:#aab5d0}
.btn-primary{background:var(--eu);color:#fff;border-color:var(--eu)}
.btn-primary:hover{background:var(--eu-d)}
.btn-gold{background:var(--gold);color:var(--eu);border-color:var(--gold-d);font-weight:600}
